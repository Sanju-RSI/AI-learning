name: Module 1 quality

on:
  push:
    paths:
      - 'module-1/**'
      - '.github/workflows/module-1-quality.yml'
  pull_request:
    paths:
      - 'module-1/**'
      - '.github/workflows/module-1-quality.yml'
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leave_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d leave_management_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: module-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: module-1/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, lint, format, and test
        run: npm run quality
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/leave_management_test
          JWT_SECRET: ci-only-leave-secret
      - name: Semgrep
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan --config .semgrep.yml --error --quiet src
